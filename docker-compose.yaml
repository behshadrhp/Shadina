services:
  postgresql:
    container_name: shadina-postgres
    image: postgres:18.4
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shadina_db
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    
volumes:
  postgres_data:
